# The vendored `egui_term` fork is a workspace member so its tests and lints
# run alongside pomptty's (in CI too), not just when built as a dependency.
[workspace]
members = [".", "vendor/egui_term"]

[package]
name = "pomptty"
version = "0.1.0"
edition = "2024"
description = "A minimal, Chrome-flavored terminal emulator"
license = "MIT"
repository = "https://github.com/MartinThoma/pomptty"
readme = "README.md"

[dependencies]
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "persistence",
    "wayland",
    "x11",
] }
wgpu = "29"
egui_term = { path = "vendor/egui_term" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
directories = "6"
notify = "8"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
fontdb = "0.24"
nucleo-matcher = "0.3"
arboard = "3.6"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package.metadata.deb]
maintainer = "Martin Thoma <info@martin-thoma.de>"
copyright = "2026, Martin Thoma <info@martin-thoma.de>"
extended-description = """\
A minimal, Chrome-flavored terminal emulator: GPU-rendered, tabbed, and \
driven by a single JSON config file that reloads as you edit it."""
section = "x11"
priority = "optional"
changelog = "packaging/changelog"
assets = [
    ["target/release/pomptty", "usr/bin/", "755"],
    ["packaging/pomptty.desktop", "usr/share/applications/", "644"],
    ["packaging/pomptty.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/pomptty/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pomptty", dest = "/usr/bin/pomptty", mode = "755" },
    { source = "packaging/pomptty.desktop", dest = "/usr/share/applications/pomptty.desktop", mode = "644" },
    { source = "packaging/pomptty.svg", dest = "/usr/share/icons/hicolor/scalable/apps/pomptty.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/pomptty/README.md", mode = "644" },
]
