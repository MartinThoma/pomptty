[package]
name = "pomptty"
version = "0.1.0"
edition = "2024"
description = "A minimal, Chrome-flavored terminal emulator"
license = "MIT"
repository = "https://github.com/MartinThoma/pomptty"

[dependencies]
egui = "0.35"
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wgpu",
    "persistence",
    "wayland",
    "x11",
] }
wgpu = "29"
egui_term = { git = "https://github.com/Harzu/egui_term", rev = "31bbc7ab8503c9518fcee5717cfa29011e59f451" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
directories = "6"
notify = "8"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
fontdb = "0.24"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
