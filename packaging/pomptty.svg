<?xml version="1.0" encoding="UTF-8"?>
<!-- pomptty app icon: a Solarized-Dark terminal tile with a Chrome-style
     active tab and a green ">_" prompt. Kept simple so it still reads at
     16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="tile">
      <rect x="16" y="16" width="224" height="224" rx="44" ry="44"/>
    </clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="224" height="224" fill="#002b36"/>

    <!-- tab strip -->
    <rect x="16" y="16" width="224" height="60" fill="#073642"/>
    <!-- active tab -->
    <path d="M40 76 v-30 a12 12 0 0 1 12 -12 h56 a12 12 0 0 1 12 12 v30 z" fill="#268bd2"/>
    <!-- inactive tab hint -->
    <rect x="140" y="42" width="72" height="26" rx="8" fill="#0b4a5c"/>

    <!-- prompt -->
    <path d="M64 118 L108 150 L64 182" fill="none" stroke="#859900"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="126" y="150" width="66" height="20" rx="3" fill="#93a1a1"/>

    <!-- top sheen for a little depth -->
    <rect x="16" y="16" width="224" height="224" fill="url(#sheen)"/>
  </g>

  <rect x="16.5" y="16.5" width="223" height="223" rx="43.5" ry="43.5"
        fill="none" stroke="#00181f" stroke-width="1"/>
</svg>
