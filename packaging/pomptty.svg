<?xml version="1.0" encoding="UTF-8"?>
<!-- pomptty app icon: a Solarized Dark terminal window with a Chrome-style
     tab strip and a ">_" prompt. A functional placeholder, not a polished
     brand asset — easy to swap out later. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="body">
      <rect x="8" y="8" width="240" height="240" rx="36" ry="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#body)">
    <rect x="8" y="8" width="240" height="240" fill="#002b36"/>

    <!-- tab strip -->
    <rect x="8" y="8" width="240" height="56" fill="#073642"/>
    <rect x="24" y="20" width="72" height="32" rx="8" ry="8" fill="#268bd2"/>
    <rect x="104" y="24" width="56" height="24" rx="7" ry="7" fill="#0a4657"/>
    <rect x="168" y="24" width="56" height="24" rx="7" ry="7" fill="#0a4657"/>

    <!-- window border -->
    <rect x="8.5" y="8.5" width="239" height="239" rx="35.5" ry="35.5"
          fill="none" stroke="#00212a" stroke-width="1"/>
  </g>

  <text x="34" y="182" font-family="DejaVu Sans Mono, Liberation Mono, monospace"
        font-size="92" font-weight="bold" fill="#859900">&gt;</text>
  <rect x="128" y="150" width="60" height="18" fill="#93a1a1"/>
</svg>
